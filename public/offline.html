<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1F2933">
    <title>오프라인 — 온라인 심사 시스템</title>
    <!--
        서비스워커가 네트워크 실패 시 돌려주는 폴백 화면.
        Tailwind·Pretendard CDN이 캐시에 없을 수도 있으므로 CSS를 전부 인라인으로 둔다.
    -->
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #F1F5F9;
            color: #334155;
            font-family: Pretendard, 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            width: 100%;
            max-width: 420px;
            padding: 40px 28px;
            border: 1px solid #E2E8F0;
            border-radius: 16px;
            background: #FFFFFF;
            text-align: center;
        }
        .mark {
            display: grid;
            grid-template: 1fr 1fr / 1fr 1fr;
            gap: 6px;
            width: 56px;
            height: 56px;
            margin: 0 auto 20px;
            padding: 12px;
            border-radius: 12px;
            background: #1F2933;
        }
        .mark i { border-radius: 2px; background: #F5F3EF; }
        .mark i:last-child { background: #4F46E5; }
        h1 { margin: 0 0 10px; font-size: 20px; font-weight: 700; color: #0F172A; }
        p { margin: 0 0 8px; font-size: 14px; }
        .note {
            margin: 20px 0 0;
            padding: 14px 16px;
            border-radius: 10px;
            background: #EEF2FF;
            color: #3730A3;
            font-size: 13px;
            text-align: left;
        }
        button {
            margin-top: 24px;
            width: 100%;
            padding: 12px 16px;
            border: 0;
            border-radius: 10px;
            background: #4F46E5;
            color: #FFFFFF;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #4338CA; }
        .muted { margin-top: 16px; font-size: 12px; color: #94A3B8; }
    </style>
</head>
<body>
    <main class="card">
        <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>

        <h1>인터넷 연결이 없습니다</h1>
        <p>이 화면은 아직 기기에 저장되어 있지 않아 열 수 없습니다.</p>

        <p class="note">
            이미 입력한 점수는 기기에 저장되어 있습니다.<br>
            연결이 돌아오면 자동으로 전송되니 다시 입력하지 않으셔도 됩니다.
        </p>

        <button type="button" onclick="location.reload()">다시 시도</button>

        <p class="muted">온라인 심사 시스템</p>
    </main>

    <script>
        // 연결이 돌아오면 사용자가 누르지 않아도 원래 보려던 화면으로 복귀한다.
        window.addEventListener('online', function () { location.reload(); });
    </script>
</body>
</html>
